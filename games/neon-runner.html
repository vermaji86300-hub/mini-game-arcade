<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play Neon Runner Online - Free Fast Rhythm Dash Game</title>
    <meta name="description" content="Play Neon Runner online for free on mobile and PC. Jump over spikes and blocks at high speed with zero downloads required.">
    <meta name="keywords" content="neon runner game, rhythm dash online, play runner unblocked, free web arcade">
    <link rel="canonical" href="https://mini-game-arcade-three.vercel.app/games/neon-runner.html">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #080c14;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .home-link {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }

        .stats-bar {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .sound-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 320px;
            background: #050811;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 8, 17, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .overlay.hidden {
            display: none;
        }

        .neon-title {
            font-size: 32px;
            font-weight: 900;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .overlay-desc {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .play-btn {
            background: linear-gradient(135deg, #00f0ff, #0284c7);
            border: none;
            color: #000;
            font-weight: 800;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .play-btn:active {
            transform: scale(0.96);
        }

        .share-btn {
            margin-top: 10px;
            background: #25d366;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .hints {
            margin-top: 10px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <a href="https://mini-game-arcade-three.vercel.app/" class="home-link">← All Games</a>
        <div class="stats-bar">
            <span>High: <strong id="high-score-val" style="color:#00f0ff">0</strong></span>
            <button id="sound-toggle" class="sound-btn">🔊 Sound</button>
        </div>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas" width="480" height="320"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1 class="neon-title">NEON RUNNER</h1>
            <p class="overlay-desc">Tap screen or press Space / Up to jump!<br>Dodge spikes & blocks. Speed increases every level!</p>
            <button id="start-btn" class="play-btn">START GAME</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="overlay hidden">
            <h2 class="neon-title" style="color: #ff0055; text-shadow: 0 0 15px rgba(255,0,85,0.8);">GAME OVER</h2>
            <p class="overlay-desc">
                Score: <strong id="final-score" style="color: #00f0ff; font-size: 18px;">0</strong> | 
                Level: <strong id="final-level" style="color: #a855f7;">1</strong>
            </p>
            <button id="restart-btn" class="play-btn">PLAY AGAIN</button>
            <a id="whatsapp-share" class="share-btn" target="_blank" href="#">
                Share on WhatsApp
            </a>
        </div>
    </div>

    <p class="hints">Controls: Press <strong>Space</strong> or <strong>Tap Screen</strong> to Jump</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreEl = document.getElementById('final-score');
        const finalLevelEl = document.getElementById('final-level');
        const highScoreEl = document.getElementById('high-score-val');
        const soundBtn = document.getElementById('sound-toggle');
        const whatsappBtn = document.getElementById('whatsapp-share');

        // Web Audio Synthesizer
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep(freq, type = 'square', duration = 0.08, endFreq = null) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                if (endFreq) {
                    osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
                }
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (err) {}
        }

        soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Muted';
        });

        // Game State
        let isRunning = false;
        let animationFrameId = null;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('neon_runner_high') || '0', 10);
        highScoreEl.textContent = highScore;

        const groundY = 270;
        let gameSpeed = 5.5;
        let obstacleTimer = 0;

        // Player
        const player = {
            x: 50,
            y: groundY - 28,
            w: 26,
            h: 26,
            vy: 0,
            gravity: 0.85,
            jumpStrength: -13.5,
            grounded: true,
            rot: 0
        };

        let obstacles = [];
        let particles = [];

        function spawnParticles(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 7,
                    vy: (Math.random() - 0.5) * 7,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 3.5 + 1.5
                });
            }
        }

        function jump() {
            if (!isRunning) return;
            if (player.grounded) {
                player.vy = player.jumpStrength;
                player.grounded = false;
                playBeep(320, 'square', 0.12, 640);
                spawnParticles(player.x + 13, player.y + 26, '#00f0ff', 6);
            }
        }

        function spawnObstacle() {
            const level = Math.floor(score / 50) + 1;
            const isTall = Math.random() < 0.35 && level >= 2;
            const w = isTall ? 20 : 22;
            const h = isTall ? 44 : 26;

            obstacles.push({
                x: canvas.width + 20,
                y: groundY - h,
                w: w,
                h: h,
                color: isTall ? '#ff0055' : '#a855f7'
            });
        }

        function checkCollision(p, o) {
            return (
                p.x + 3 < o.x + o.w &&
                p.x + p.w - 3 > o.x &&
                p.y + 3 < o.y + o.h &&
                p.y + p.h - 2 > o.y
            );
        }

        function triggerGameOver() {
            isRunning = false;
            cancelAnimationFrame(animationFrameId);
            playBeep(180, 'sawtooth', 0.35, 40);
            spawnParticles(player.x + 13, player.y + 13, '#ff0055', 25);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neon_runner_high', highScore);
                highScoreEl.textContent = highScore;
            }

            const currentLevel = Math.floor(score / 50) + 1;
            finalScoreEl.textContent = score;
            finalLevelEl.textContent = currentLevel;

            const shareText = encodeURIComponent(
                `⚡ I scored ${score} pts (Level ${currentLevel}) in Neon Runner! Can you beat my high score? Play here: https://mini-game-arcade-three.vercel.app/games/neon-runner.html`
            );
            whatsappBtn.href = `https://api.whatsapp.com/send?text=${shareText}`;

            gameoverScreen.classList.remove('hidden');
        }

        function resetGame() {
            score = 0;
            gameSpeed = 5.5;
            obstacleTimer = 0;
            obstacles = [];
            particles = [];
            player.y = groundY - 28;
            player.vy = 0;
            player.grounded = true;
            player.rot = 0;
            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            isRunning = true;
            initAudio();
            playBeep(440, 'sine', 0.1, 880);
            gameLoop();
        }

        function update() {
            score++;
            const level = Math.floor(score / 50) + 1;
            gameSpeed = 5.5 + Math.min(level * 0.45, 6.0);

            // Player physics
            player.vy += player.gravity;
            player.y += player.vy;

            if (player.y >= groundY - player.h) {
                player.y = groundY - player.h;
                player.vy = 0;
                player.grounded = true;
                player.rot = 0;
            } else {
                player.rot += 0.12;
            }

            // Obstacles
            obstacleTimer++;
            const spawnInterval = Math.max(55, 95 - level * 3);
            if (obstacleTimer >= spawnInterval) {
                spawnObstacle();
                obstacleTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= gameSpeed;

                if (checkCollision(player, obs)) {
                    triggerGameOver();
                    return;
                }

                if (obs.x + obs.w < -10) {
                    obstacles.splice(i, 1);
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.life -= 0.035;
                if (pt.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground & Neon Grid
            ctx.strokeStyle = '#00f0ff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00f0ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // Background horizon lines
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
            ctx.lineWidth = 1;
            ctx.shadowBlur = 0;
            for (let y = groundY + 10; y < canvas.height; y += 14) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Obstacles
            for (const obs of obstacles) {
                ctx.fillStyle = obs.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            }

            // Particles
            for (const pt of particles) {
                ctx.globalAlpha = Math.max(0, pt.life);
                ctx.fillStyle = pt.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = pt.color;
                ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
            }
            ctx.globalAlpha = 1.0;

            // Player Cube with Rotation
            ctx.save();
            ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
            ctx.rotate(player.rot);
            ctx.fillStyle = '#00f0ff';
            ctx.shadowBlur = 16;
            ctx.shadowColor = '#00f0ff';
            ctx.fillRect(-player.w / 2, -player.h / 2, player.w, player.h);
            ctx.restore();

            // HUD Score & Level
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 15px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 16, 26);
            ctx.fillStyle = '#a855f7';
            ctx.fillText(`LVL ${Math.floor(score / 50) + 1}`, 16, 46);
        }

        function gameLoop() {
            if (!isRunning) return;
            update();
            render();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Event Listeners
        startBtn.addEventListener('click', resetGame);
        restartBtn.addEventListener('click', resetGame);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (isRunning) {
                    jump();
                } else if (!startScreen.classList.contains('hidden') || !gameoverScreen.classList.contains('hidden')) {
                    resetGame();
                }
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isRunning) jump();
        }, { passive: false });

        canvas.addEventListener('mousedown', () => {
            if (isRunning) jump();
        });
    </script>
</body>
</html>
