<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Runner - Mini Arcade</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #080c14; color: #f8fafc; font-family: system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden;
        }
        header {
            width: 100%; max-width: 480px; display: flex; justify-content: space-between;
            align-items: center; padding: 12px 18px; z-index: 10;
        }
        .back-btn { color: #38bdf8; text-decoration: none; font-weight: 600; font-size: 15px; }
        .stats { display: flex; gap: 15px; font-weight: bold; font-size: 16px; }
        .game-container {
            position: relative; width: 100%; max-width: 460px; height: 520px;
            background: #0f172a; border-radius: 16px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        canvas { width: 100%; height: 100%; display: block; touch-action: none; }
        .overlay {
            position: absolute; inset: 0; background: rgba(8, 12, 20, 0.88);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 14px; z-index: 20; padding: 20px; text-align: center;
        }
        .overlay h2 { font-size: 32px; color: #38bdf8; font-weight: 900; }
        .overlay p { font-size: 15px; color: #cbd5e1; line-height: 1.5; }
        .btn {
            background: linear-gradient(135deg, #0284c7, #38bdf8); color: #04101e;
            border: none; padding: 12px 30px; font-size: 17px; font-weight: 800;
            border-radius: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="back-btn">← Back to Arcade</a>
        <div class="stats">
            <div>Score: <span id="scoreVal" style="color: #4ade80;">0</span></div>
            <div>Level: <span id="lvlVal" style="color: #38bdf8;">1</span></div>
        </div>
    </header>

    <div class="game-container" id="gameBox">
        <canvas id="gameCanvas" width="460" height="520"></canvas>

        <div id="startScreen" class="overlay">
            <h2>NEON RUNNER</h2>
            <p>Tap screen or press Space / Up to jump!</p>
            <p style="color: #38bdf8; font-size: 13px;">Dodge spikes & blocks. Speed increases every level!</p>
            <button class="btn" onclick="startGame()">Start Game</button>
        </div>

        <div id="overScreen" class="overlay" style="display:none;">
            <h2 style="color: #f43f5e;">CRASHED! 💥</h2>
            <p id="finalScore" style="font-size: 20px; font-weight: bold;">Score: 0</p>
            <button class="btn" onclick="startGame()">Retry</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('scoreVal');
        const lvlVal = document.getElementById('lvlVal');
        const startScreen = document.getElementById('startScreen');
        const overScreen = document.getElementById('overScreen');

        // Web Audio API Audio Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                if (type === 'jump') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(680, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'crash') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'level') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.setValueAtTime(650, now + 0.1);
                    osc.frequency.setValueAtTime(780, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            } catch(e) {}
        }

        let isRunning = false;
        let score = 0;
        let level = 1;
        let screenShake = 0;

        const groundY = 430;
        let player = {
            x: 60,
            y: groundY - 30,
            size: 30,
            vy: 0,
            gravity: 0.65,
            jumpPower: -11.5,
            isGrounded: true,
            rotation: 0
        };

        let obstacles = [];
        let particles = [];
        let lastObstacleX = 0;

        function jump() {
            if (!isRunning) return;
            if (player.isGrounded) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
                playSound('jump');
                // Dust effect
                for (let i = 0; i < 6; i++) {
                    particles.push({
                        x: player.x + player.size / 2,
                        y: groundY,
                        vx: (Math.random() - 0.5) * 4,
                        vy: -(Math.random() * 2),
                        size: Math.random() * 3 + 2,
                        color: '#64748b',
                        life: 1
                    });
                }
            }
        }

        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });
        canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, { passive: false });
        canvas.addEventListener('mousedown', jump);

        function startGame() {
            player.y = groundY - 30;
            player.vy = 0;
            player.rotation = 0;
            player.isGrounded = true;
            score = 0;
            level = 1;
            screenShake = 0;
            obstacles = [];
            particles = [];
            lastObstacleX = canvas.width + 100;
            scoreVal.innerText = score;
            lvlVal.innerText = level;
            startScreen.style.display = 'none';
            overScreen.style.display = 'none';
            isRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function spawnObstacles(speed) {
            if (obstacles.length === 0 || lastObstacleX < canvas.width - (Math.random() * 80 + 170 - (level * 10))) {
                const isDouble = level >= 2 && Math.random() < 0.35;
                const isBlock = level >= 3 && Math.random() < 0.3;

                if (isBlock) {
                    obstacles.push({
                        type: 'block',
                        x: canvas.width,
                        y: groundY - 32,
                        w: 32,
                        h: 32
                    });
                } else {
                    obstacles.push({
                        type: 'spike',
                        x: canvas.width,
                        y: groundY,
                        w: 26,
                        h: 28,
                        double: isDouble
                    });
                }
                lastObstacleX = canvas.width;
            }
        }

        function gameLoop() {
            if (!isRunning) return;

            // Progressive Level & Speed Calculation
            level = Math.min(4, Math.floor(score / 50) + 1);
            if (lvlVal.innerText != level) {
                lvlVal.innerText = level;
                playSound('level');
            }

            // Speed scales up: 4.0 -> 5.0 -> 6.2 -> 7.5
            const baseSpeed = 4.0 + (level - 1) * 1.15;

            // Screen Shake Effect
            ctx.save();
            if (screenShake > 0) {
                const rx = (Math.random() - 0.5) * screenShake;
                const ry = (Math.random() - 0.5) * screenShake;
                ctx.translate(rx, ry);
                screenShake *= 0.88;
                if (screenShake < 0.5) screenShake = 0;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground & Grid Line
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // Background ambient grid floor
            ctx.fillStyle = '#0b1329';
            ctx.fillRect(0, groundY + 3, canvas.width, canvas.height - groundY);

            // Score Increment
            score++;
            scoreVal.innerText = Math.floor(score / 3);

            // Player Physics
            player.vy += player.gravity;
            player.y += player.vy;

            if (player.y >= groundY - player.size) {
                player.y = groundY - player.size;
                player.vy = 0;
                player.isGrounded = true;
                player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
            } else {
                player.isGrounded = false;
                player.rotation += 0.12;
            }

            // Draw Trail Particles
            if (Math.random() < 0.4) {
                particles.push({
                    x: player.x,
                    y: player.y + player.size / 2,
                    vx: -baseSpeed * 0.7,
                    vy: (Math.random() - 0.5) * 1,
                    size: 3,
                    color: level >= 3 ? '#ec4899' : '#38bdf8',
                    life: 0.8
                });
            }

            // Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.life -= 0.04;
                if (pt.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.fillStyle = pt.color;
                    ctx.globalAlpha = pt.life;
                    ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
                    ctx.globalAlpha = 1.0;
                }
            }

            // Draw Player Cube
            ctx.save();
            ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
            ctx.rotate(player.rotation);
            ctx.fillStyle = level >= 3 ? '#ec4899' : '#38bdf8';
            ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);
            // Inner eye
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(player.size / 6, -player.size / 4, 6, 6);
            ctx.restore();

            // Obstacles Spawn
            spawnObstacles(baseSpeed);

            // Obstacles Update & Draw
            lastObstacleX -= baseSpeed;
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= baseSpeed;

                if (obs.type === 'spike') {
                    // Draw Spike
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y);
                    ctx.lineTo(obs.x + obs.w / 2, obs.y - obs.h);
                    ctx.lineTo(obs.x + obs.w, obs.y);
                    ctx.closePath();
                    ctx.fill();

                    if (obs.double) {
                        ctx.beginPath();
                        ctx.moveTo(obs.x + obs.w, obs.y);
                        ctx.lineTo(obs.x + obs.w + obs.w / 2, obs.y - obs.h);
                        ctx.lineTo(obs.x + obs.w * 2, obs.y);
                        ctx.closePath();
                        ctx.fill();
                    }

                    // Collision (Hitbox margin for precision)
                    const totalW = obs.double ? obs.w * 2 : obs.w;
                    if (
                        player.x + player.size - 6 > obs.x &&
                        player.x + 6 < obs.x + totalW &&
                        player.y + player.size - 4 > obs.y - obs.h
                    ) {
                        triggerCrash();
                        ctx.restore();
                        return;
                    }
                } else if (obs.type === 'block') {
                    // Draw Block
                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);

                    // Block Collision
                    if (
                        player.x + player.size - 4 > obs.x &&
                        player.x + 4 < obs.x + obs.w &&
                        player.y + player.size - 4 > obs.y
                    ) {
                        triggerCrash();
                        ctx.restore();
                        return;
                    }
                }

                if (obs.x < -80) obstacles.splice(i, 1);
            }

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        function triggerCrash() {
            isRunning = false;
            screenShake = 12;
            playSound('crash');

            // Shatter Cube Effect
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: player.x + player.size / 2,
                    y: player.y + player.size / 2,
                    vx: (Math.random() - 0.5) * 9,
                    vy: (Math.random() - 0.5) * 9,
                    size: Math.random() * 5 + 3,
                    color: level >= 3 ? '#ec4899' : '#38bdf8',
                    life: 1.2
                });
            }

            document.getElementById('finalScore').innerText = `Final Score: ${Math.floor(score / 3)}`;
            overScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
