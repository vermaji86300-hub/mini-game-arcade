<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play Neon Runner Online - Free Fast Rhythm Dash Game</title>
<meta name="description" content="Play Neon Runner online for free on mobile and PC. Jump over spikes and blocks at sonic speed. No download or install required.">
<link rel="canonical" href="https://mini-game-arcade-three.vercel.app/games/neon-runner.html">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #080c14; color: #f8fafc; font-family: system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden;
        }
        header {
            width: 100%; max-width: 480px; display: flex; justify-content: space-between;
            align-items: center; padding: 12px 18px; z-index: 10;
        }
        .back-btn { color: #38bdf8; text-decoration: none; font-weight: 600; font-size: 15px; }
        .stats { display: flex; gap: 15px; font-weight: bold; font-size: 16px; }
        .game-container {
            position: relative; width: 100%; max-width: 460px; height: 520px;
            background: #0f172a; border-radius: 16px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        canvas { width: 100%; height: 100%; display: block; touch-action: none; }
        .overlay {
            position: absolute; inset: 0; background: rgba(8, 12, 20, 0.9);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 12px; z-index: 20; padding: 20px; text-align: center;
        }
        .overlay h2 { font-size: 32px; color: #38bdf8; font-weight: 900; }
        .overlay p { font-size: 15px; color: #cbd5e1; line-height: 1.5; }
        .btn {
            background: linear-gradient(135deg, #0284c7, #38bdf8); color: #04101e;
            border: none; padding: 12px 28px; font-size: 16px; font-weight: 800;
            border-radius: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-whatsapp {
            background: #25D366; color: white; border: none; padding: 12px 28px;
            font-size: 16px; font-weight: 800; border-radius: 10px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35); text-decoration: none;
            display: inline-block; transition: transform 0.1s;
        }
        .btn-whatsapp:hover { transform: translateY(-2px); background: #1eb956; }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="back-btn">← Back to Arcade</a>
        <div class="stats">
            <div>Score: <span id="scoreVal" style="color: #4ade80;">0</span></div>
            <div>Level: <span id="lvlVal" style="color: #38bdf8;">1</span></div>
        </div>
    </header>

    <div class="game-container" id="gameBox">
        <canvas id="gameCanvas" width="460" height="520"></canvas>

        <div id="startScreen" class="overlay">
            <h2>NEON RUNNER</h2>
            <p>Tap screen or press Space / Up to jump!</p>
            <p style="color: #38bdf8; font-size: 13px;">Dodge spikes & blocks. Speed increases every level!</p>
            <button class="btn" onclick="startGame()">Start Game</button>
        </div>

        <div id="overScreen" class="overlay" style="display:none;">
            <h2 style="color: #f43f5e;">CRASHED! 💥</h2>
            <p id="finalScore" style="font-size: 20px; font-weight: bold;">Score: 0</p>
            <button class="btn" onclick="startGame()">Retry</button>
            <button class="btn-whatsapp" onclick="shareOnWhatsApp()">Share on WhatsApp</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('scoreVal');
        const lvlVal = document.getElementById('lvlVal');
        const startScreen = document.getElementById('startScreen');
        const overScreen = document.getElementById('overScreen');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                if (type === 'jump') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(680, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'crash') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'level') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.setValueAtTime(650, now + 0.1);
                    osc.frequency.setValueAtTime(780, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            } catch(e) {}
        }
