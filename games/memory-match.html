<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play Memory Match Online - Free Brain Memory Card Game</title>
    <meta name="description" content="Play Memory Match online for free. Test your brain speed, flip cards, and match emoji pairs to climb the Top 5 leaderboard.">
    <link rel="canonical" href="https://mini-game-arcade-three.vercel.app/games/memory-match.html">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #080c14;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        header {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .home-link { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .stats-bar { display: flex; gap: 14px; align-items: center; }
        .sound-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        #game-board {
            width: 100%;
            max-width: 420px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 14px;
            background: #0f172a;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            border-radius: 14px;
        }
        .card {
            aspect-ratio: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
        }
        .card:hover { transform: scale(1.03); border-color: #38bdf8; }
        .card.flipped { background: #0284c7; transform: rotateY(180deg); }
        .card.matched { background: #15803d; border-color: #22c55e; cursor: default; }

        .gameover-box {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 17, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 50;
        }
        .gameover-box.hidden { display: none; }
        .neon-title {
            font-size: 28px;
            font-weight: 900;
            color: #22c55e;
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.8);
            margin-bottom: 6px;
        }
        .leaderboard-box {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 8px 14px;
            width: 100%;
            max-width: 250px;
            margin-bottom: 12px;
            text-align: left;
        }
        .lb-title {
            font-size: 11px;
            font-weight: 800;
            color: #22c55e;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        #leaderboard-list {
            padding-left: 20px;
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.4;
        }
        .play-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            color: #000;
            font-weight: 800;
            padding: 10px 24px;
            font-size: 15px;
            border-radius: 30px;
            cursor: pointer;
        }
        .share-btn {
            margin-top: 8px;
            background: #25d366;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
        }
        .seo-box {
            width: 100%;
            max-width: 420px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 16px;
            margin-top: 14px;
            font-size: 13px;
            line-height: 1.6;
            color: #94a3b8;
        }
        .seo-box h2 { font-size: 15px; color: #38bdf8; margin-bottom: 6px; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="home-link">← All Games</a>
        <div class="stats-bar">
            <span>Moves: <strong id="moves-val" style="color:#38bdf8">0</strong></span>
            <span>Best: <strong id="best-moves-val" style="color:#22c55e">-</strong></span>
            <button id="sound-toggle" class="sound-btn">🔊 Sound</button>
        </div>
    </header>

    <div id="game-board"></div>

    <div id="gameover-box" class="gameover-box hidden">
        <h2 class="neon-title">PUZZLE SOLVED! 🎉</h2>
        <p style="color: #cbd5e1; font-size: 14px; margin-bottom: 10px;">Solved in <strong id="final-moves" style="color:#38bdf8">0</strong> moves!</p>

        <div class="leaderboard-box">
            <div class="lb-title">🏆 TOP 5 (FEWEST MOVES)</div>
            <ol id="leaderboard-list"></ol>
        </div>

        <button id="restart-btn" class="play-btn">PLAY AGAIN</button>
        <a id="whatsapp-share" class="share-btn" target="_blank" href="#">Share on WhatsApp</a>
    </div>

    <article class="seo-box">
        <h2>Cognitive Memory Training</h2>
        <p>Flip cards two at a time. In this game, fewer moves mean a better ranking on your Top 5 leaderboard!</p>
    </article>

    <script>
        const board = document.getElementById('game-board');
        const movesVal = document.getElementById('moves-val');
        const bestMovesVal = document.getElementById('best-moves-val');
        const gameoverBox = document.getElementById('gameover-box');
        const finalMovesEl = document.getElementById('final-moves');
        const restartBtn = document.getElementById('restart-btn');
        const soundBtn = document.getElementById('sound-toggle');
        const whatsappBtn = document.getElementById('whatsapp-share');

        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                const AudioClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioClass();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(freq, duration = 0.08, type = 'sine') {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Muted';
        });

        // Top 5 Leaderboard (Ascending: lowest moves is #1)
        function updateLeaderboard(newMoves) {
            let scores = JSON.parse(localStorage.getItem('memory_match_top5') || '[]');
            if (newMoves > 0) {
                scores.push(newMoves);
                scores.sort((a, b) => a - b);
                scores = scores.slice(0, 5);
                localStorage.setItem('memory_match_top5', JSON.stringify(scores));
            }
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = scores.length
                ? scores.map((m) => `<li><span style="color:#22c55e">${m} moves</span></li>`).join('')
                : '<li>No scores yet</li>';
        }

        const emojis = ['🚀', '💎', '⚡', '🎮', '🍉', '👾', '🌟', '🔔'];
        let cards = [];
        let flippedCards = [];
        let moves = 0;
        let matchedPairs = 0;
        let isLocked = false;

        let bestMoves = localStorage.getItem('memory_match_best');
        if (bestMoves) bestMovesVal.textContent = bestMoves;

        function createDeck() {
            const deck = [...emojis, ...emojis];
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        function buildBoard() {
            board.innerHTML = '';
            moves = 0;
            matchedPairs = 0;
            flippedCards = [];
            isLocked = false;
            movesVal.textContent = '0';
            gameoverBox.classList.add('hidden');

            const deck = createDeck();
            cards = [];

            deck.forEach((emoji, idx) => {
                const el = document.createElement('div');
                el.classList.add('card');
                el.dataset.emoji = emoji;
                el.dataset.idx = idx;
                el.textContent = '❓';
                el.addEventListener('click', () => flipCard(el));
                board.appendChild(el);
                cards.push(el);
            });
        }

        function flipCard(card) {
            initAudio();
            if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            card.textContent = card.dataset.emoji;
            playSound(400, 0.05);
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesVal.textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [c1, c2] = flippedCards;
            if (c1.dataset.emoji === c2.dataset.emoji) {
                c1.classList.add('matched');
                c2.classList.add('matched');
                matchedPairs++;
                playSound(650, 0.12);
                flippedCards = [];

                if (matchedPairs === 8) {
                    setTimeout(handleWin, 400);
                }
            } else {
                isLocked = true;
                playSound(220, 0.12, 'sawtooth');
                setTimeout(() => {
                    c1.classList.remove('flipped');
                    c2.classList.remove('flipped');
                    c1.textContent = '❓';
                    c2.textContent = '❓';
                    flippedCards = [];
                    isLocked = false;
                }, 750);
            }
        }

        function handleWin() {
            playSound(800, 0.3);
            finalMovesEl.textContent = moves;
            if (!bestMoves || moves < parseInt(bestMoves, 10)) {
                localStorage.setItem('memory_match_best', moves);
                bestMovesVal.textContent = moves;
            }
            updateLeaderboard(moves);

            const text = encodeURIComponent(`🧠 I solved Memory Match in ${moves} moves! Beat my record: https://mini-game-arcade-three.vercel.app/games/memory-match.html`);
            whatsappBtn.href = `https://api.whatsapp.com/send?text=${text}`;
            gameoverBox.classList.remove('hidden');
        }

        restartBtn.addEventListener('click', buildBoard);
        buildBoard();
    </script>
</body>
</html>
