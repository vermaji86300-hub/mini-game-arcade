<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match - Mini Game Arcade</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 70px);
      gap: 12px;
      justify-content: center;
      margin: 2rem auto;
    }
    .card {
      width: 70px;
      height: 70px;
      background: #334155;
      color: transparent;
      font-size: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: background 0.3s;
    }
    .card.flipped {
      background: #0284c7;
      color: #fff;
    }
    .card.matched {
      background: #10b981;
      color: #fff;
      cursor: default;
    }
  </style>
</head>
<body>
  <header><div class="container navbar"><h1 class="logo">🎮 Mini Arcade</h1><nav><a href="../index.html">← Back to Arcade</a></nav></div></header>
  <main class="container" style="text-align: center; padding: 2rem 0;">
    <h2>🧠 Memory Match</h2>
    <p>Find matching pairs in minimum moves!</p>
    <p>Moves: <span id="moves">0</span></p>
    <div class="game-board" id="board"></div>
    <button class="btn" onclick="initBoard()">Restart Game</button>
  </main>

  <script>
    const icons = ["🐱", "🐶", "🦊", "🐼", "🐸", "🐵"];
    let cards = [...icons, ...icons];
    let flipped = [], moves = 0, matchedPairs = 0;

    function initBoard() {
      cards.sort(() => 0.5 - Math.random());
      const board = document.getElementById("board");
      board.innerHTML = "";
      moves = 0; matchedPairs = 0; flipped = [];
      document.getElementById("moves").innerText = moves;

      cards.forEach((icon, i) => {
        let el = document.createElement("div");
        el.className = "card";
        el.dataset.icon = icon;
        el.onclick = () => flipCard(el);
        board.appendChild(el);
      });
    }

    function flipCard(el) {
      if (flipped.length < 2 && !el.classList.contains("flipped") && !el.classList.contains("matched")) {
        el.classList.add("flipped");
        el.innerText = el.dataset.icon;
        flipped.push(el);

        if (flipped.length === 2) {
          moves++;
          document.getElementById("moves").innerText = moves;
          if (flipped[0].dataset.icon === flipped[1].dataset.icon) {
            flipped[0].classList.add("matched");
            flipped[1].classList.add("matched");
            matchedPairs++;
            flipped = [];
            if (matchedPairs === icons.length) {
              setTimeout(() => alert(`Won in ${moves} moves!`), 300);
            }
          } else {
            setTimeout(() => {
              flipped[0].classList.remove("flipped");
              flipped[0].innerText = "";
              flipped[1].classList.remove("flipped");
              flipped[1].innerText = "";
              flipped = [];
            }, 800);
          }
        }
      }
    }
    initBoard();
  </script>
</body>
</html>
