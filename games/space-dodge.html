<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Dodge 2D - Dodge Meteorites & Space Debris</title>
    <meta name="description" content="Steer your spaceship across infinite cosmic waves dodging fast meteorites. Play Space Dodge free online with zero installation.">
    <meta name="keywords" content="space dodge online, spaceship meteorite game, 2d space runner, free browser games">
    <link rel="canonical" href="https://mini-game-arcade-three.vercel.app/games/space-dodge.html">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #090d16; color: #f8fafc; font-family: system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden;
        }
        header {
            width: 100%; max-width: 480px; display: flex; justify-content: space-between;
            align-items: center; padding: 12px 15px;
        }
        .back-btn { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .stats { display: flex; gap: 15px; font-weight: bold; }
        .game-container {
            position: relative; width: 100%; max-width: 480px; height: 580px;
            background: #0f172a; border-radius: 12px; overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; touch-action: none; }
        .overlay {
            position: absolute; inset: 0; background: rgba(9, 13, 22, 0.9);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 12px; z-index: 10; padding: 20px; text-align: center;
        }
        .btn {
            background: #0284c7; color: white; border: none; padding: 12px 28px;
            font-size: 17px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        .btn:hover { background: #0369a1; }
        .btn-whatsapp {
            background: #25D366; color: white; border: none; padding: 12px 28px;
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35); text-decoration: none;
            display: inline-block; transition: transform 0.1s;
        }
        .btn-whatsapp:hover { background: #1eb956; transform: translateY(-2px); }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="back-btn">← Back</a>
        <div class="stats">
            <div>Score: <span id="scoreVal" style="color:#4ade80;">0</span></div>
            <div>Lvl: <span id="lvlVal" style="color:#38bdf8;">1</span></div>
        </div>
    </header>

    <div class="game-container">
        <canvas id="gameCanvas" width="480" height="580"></canvas>
        <div id="startScreen" class="overlay">
            <h2>Space Dodge</h2>
            <p>Drag spaceship left/right to dodge meteorites!</p>
            <button class="btn" onclick="startGame()">Launch</button>
        </div>
        <div id="overScreen" class="overlay" style="display:none;">
            <h2 style="color:#f43f5e;">Destroyed! 💥</h2>
            <p id="finalScore">Score: 0</p>
            <button class="btn" onclick="startGame()">Try Again</button>
            <button class="btn-whatsapp" onclick="shareOnWhatsApp()">Share on WhatsApp</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('scoreVal');
        const lvlVal = document.getElementById('lvlVal');
        const startScreen = document.getElementById('startScreen');
        const overScreen = document.getElementById('overScreen');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(freq, dur, type='sine') {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            } catch(e) {}
        }

        let isRunning = false, score = 0, level = 1;
        let ship = { x: 220, y: 510, size: 34 };
        let enemies = [], stars = [];

        for (let i = 0; i < 40; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1 });
        }

        function setShipX(clientX) {
            const rect = canvas.getBoundingClientRect();
            const relX = (clientX - rect.left) * (canvas.width / rect.width);
            ship.x = Math.max(10, Math.min(canvas.width - ship.size - 10, relX - ship.size / 2));
        }

        canvas.addEventListener('mousemove', e => setShipX(e.clientX));
        canvas.addEventListener('touchmove', e => { e.preventDefault(); setShipX(e.touches[0].clientX); }, { passive: false });

        function startGame() {
            score = 0; level = 1; enemies = [];
            ship.x = 220;
            scoreVal.innerText = score;
            lvlVal.innerText = level;
            startScreen.style.display = 'none';
            overScreen.style.display = 'none';
            isRunning = true;
            requestAnimationFrame(loop);
        }

        let lastSpawn = 0;
        function loop(timestamp) {
            if (!isRunning) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#64748b';
            stars.forEach(st => {
                st.y += 2 + level * 0.4;
                if (st.y > canvas.height) st.y = 0;
                ctx.fillRect(st.x, st.y, st.s, st.s);
            });

            score++;
            scoreVal.innerText = Math.floor(score / 5);
            level = Math.floor(score / 250) + 1;
            lvlVal.innerText = level;

            const spawnRate = Math.max(300, 750 - (level * 50));
            if (timestamp - lastSpawn > spawnRate) {
                enemies.push({
                    x: Math.random() * (canvas.width - 40) + 20,
                    y: -30,
                    radius: Math.random() * 12 + 14,
                    speed: Math.random() * 2 + 3 + (level * 0.7)
                });
                lastSpawn = timestamp;
            }

            ctx.font = `${ship.size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('🚀', ship.x + ship.size / 2, ship.y + ship.size / 2);

            for (let i = enemies.length - 1; i >= 0; i--) {
                const en = enemies[i];
                en.y += en.speed;

                ctx.font = `${en.radius * 2}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText('☄️', en.x, en.y);

                const dist = Math.hypot((ship.x + ship.size / 2) - en.x, (ship.y + ship.size / 2) - en.y);
                if (dist < en.radius + ship.size / 3) {
                    isRunning = false;
                    playSfx(120, 0.4, 'sawtooth');
                    document.getElementById('finalScore').innerText = `Final Score: ${Math.floor(score / 5)}`;
                    overScreen.style.display = 'flex';
                    return;
                }

                if (en.y > canvas.height + 40) enemies.splice(i, 1);
            }

            requestAnimationFrame(loop);
        }

        function shareOnWhatsApp() {
            const finalPts = Math.floor(score / 5);
            const text = "Maine Space Dodge me " + finalPts + " points banaye (Level " + level + ")! Kya tum mera score beat kar sakte ho? Khelo yahan: " + window.location.href;
            const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(text);
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
