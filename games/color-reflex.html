<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Reflex - Mini Arcade</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden;
        }
        header {
            width: 100%; max-width: 450px; display: flex; justify-content: space-between;
            align-items: center; padding: 12px 18px;
        }
        .back-btn { color: #38bdf8; text-decoration: none; font-weight: 600; font-size: 15px; }
        .stats { display: flex; gap: 15px; font-weight: bold; font-size: 16px; }
        .game-container {
            position: relative; width: 100%; max-width: 420px; height: 520px;
            background: #1e293b; border-radius: 16px; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 20px 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .timer-bar-container {
            width: 100%; height: 10px; background: #334155; border-radius: 5px; overflow: hidden;
        }
        .timer-bar {
            width: 100%; height: 100%; background: #38bdf8; transition: width 0.1s linear;
        }
        .target-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex-grow: 1; width: 100%;
        }
        .instruction {
            font-size: 14px; color: #94a3b8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;
        }
        .color-word {
            font-size: 50px; font-weight: 900; letter-spacing: 2px;
            text-transform: uppercase; transition: transform 0.1s;
        }
        .buttons-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%;
        }
        .color-btn {
            height: 60px; border: none; border-radius: 10px; font-size: 18px;
            font-weight: bold; color: white; cursor: pointer; transition: transform 0.08s, filter 0.08s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .color-btn:active { transform: scale(0.96); filter: brightness(1.2); }
        .overlay {
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.92);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 15px; z-index: 20; padding: 20px; text-align: center;
        }
        .overlay h2 { font-size: 32px; color: #38bdf8; }
        .overlay p { font-size: 15px; color: #cbd5e1; line-height: 1.5; }
        .btn {
            background: #0284c7; color: white; border: none; padding: 12px 28px;
            font-size: 17px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        .btn:hover { background: #0369a1; }
    </style>
</head>
<body>

        <a href="../index.html" class="back-btn">← Back to Arcade</a>
