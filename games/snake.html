<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play Snake Classic Online - Free Retro 90s Arcade Game</title>
    <meta name="description" content="Play classic retro snake online for free. Eat apples, grow longer, and compete on the Top 5 leaderboard.">
    <link rel="canonical" href="https://mini-game-arcade-three.vercel.app/games/snake.html">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #080c14;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .home-link { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .stats-bar { display: flex; gap: 12px; align-items: center; }
        .sound-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 400px;
            background: #050811;
            border: 2px solid #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
            border-radius: 12px;
            overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 8, 17, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 16px;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        .overlay.hidden { display: none; }
        .neon-title {
            font-size: 28px;
            font-weight: 900;
            color: #22c55e;
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.8);
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .leaderboard-box {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 8px 14px;
            width: 100%;
            max-width: 250px;
            margin-bottom: 12px;
            text-align: left;
        }
        .lb-title {
            font-size: 11px;
            font-weight: 800;
            color: #22c55e;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        #leaderboard-list {
            padding-left: 20px;
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.4;
        }
        .play-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            color: #000;
            font-weight: 800;
            padding: 10px 24px;
            font-size: 15px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
        }
        .mobile-dpad {
            display: grid;
            grid-template-columns: repeat(3, 48px);
            gap: 6px;
            margin-top: 10px;
        }
        .dpad-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            height: 48px;
            border-radius: 10px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .share-btn {
            margin-top: 8px;
            background: #25d366;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
        }
        .seo-box {
            width: 100%;
            max-width: 400px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 16px;
            margin-top: 14px;
            font-size: 13px;
            line-height: 1.6;
            color: #94a3b8;
        }
        .seo-box h2 { font-size: 15px; color: #22c55e; margin-bottom: 6px; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="home-link">← All Games</a>
        <div class="stats-bar">
            <span>High: <strong id="high-score-val" style="color:#22c55e">0</strong></span>
            <button id="sound-toggle" class="sound-btn">🔊 Sound</button>
        </div>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div id="start-screen" class="overlay">
            <h1 class="neon-title">SNAKE CLASSIC</h1>
            <p style="color: #94a3b8; font-size: 13px; margin-bottom: 14px;">Use arrows or touch D-Pad to steer.<br>Survive and beat your best records!</p>
            <button id="start-btn" class="play-btn">START GAME</button>
        </div>

        <div id="gameover-screen" class="overlay hidden">
            <h2 class="neon-title" style="color: #ef4444;">GAME OVER</h2>
            <p style="color: #94a3b8; font-size: 13px; margin-bottom: 12px;">Score: <strong id="final-score" style="color: #22c55e; font-size: 18px;">0</strong></p>

            <div class="leaderboard-box">
                <div class="lb-title">🏆 TOP 5 SCORES</div>
                <ol id="leaderboard-list"></ol>
            </div>

            <button id="restart-btn" class="play-btn">PLAY AGAIN</button>
            <a id="whatsapp-share" class="share-btn" target="_blank" href="#">Share on WhatsApp</a>
        </div>
    </div>

    <div class="mobile-dpad">
        <div></div>
        <button class="dpad-btn" onclick="setDir('UP')">▲</button>
        <div></div>
        <button class="dpad-btn" onclick="setDir('LEFT')">◀</button>
        <button class="dpad-btn" onclick="setDir('DOWN')">▼</button>
        <button class="dpad-btn" onclick="setDir('RIGHT')">▶</button>
    </div>

    <article class="seo-box">
        <h2>Retro Nokia Snake Rules</h2>
        <p>Eat apples to grow. Avoid walls and your tail to set new leaderboard highs.</p>
    </article>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreEl = document.getElementById('final-score');
        const highScoreEl = document.getElementById('high-score-val');
        const soundBtn = document.getElementById('sound-toggle');
        const whatsappBtn = document.getElementById('whatsapp-share');

        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                const AudioClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioClass();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(freq, duration = 0.08) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Muted';
        });

        // Top 5 Leaderboard
        function updateLeaderboard(newScore) {
            let scores = JSON.parse(localStorage.getItem('snake_top5') || '[]');
            if (newScore > 0) {
                scores.push(newScore);
                scores.sort((a, b) => b - a);
                scores = scores.slice(0, 5);
                localStorage.setItem('snake_top5', JSON.stringify(scores));
            }
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = scores.length
                ? scores.map((s) => `<li><span style="color:#22c55e">${s} pts</span></li>`).join('')
                : '<li>No scores yet</li>';
        }

        const gridSize = 20;
        const tileCount = 20;
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 0, dy = 0;
        let nextDx = 0, nextDy = 0;
        let isRunning = false;
        let gameInterval = null;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snake_high') || '0', 10);
        highScoreEl.textContent = highScore;

        function placeFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        }

        function setDir(dir) {
            if (!isRunning) return;
            if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -1; }
            if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = 1; }
            if (dir === 'LEFT' && dx === 0) { nextDx = -1; nextDy = 0; }
            if (dir === 'RIGHT' && dx === 0) { nextDx = 1; nextDy = 0; }
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }];
            dx = 0; dy = -1;
            nextDx = 0; nextDy = -1;
            score = 0;
            placeFood();
            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            isRunning = true;
            initAudio();
            clearInterval(gameInterval);
            gameInterval = setInterval(gameStep, 100);
        }

        function triggerGameOver() {
            isRunning = false;
            clearInterval(gameInterval);
            playSound(120, 0.3);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_high', highScore);
                highScoreEl.textContent = highScore;
            }
            finalScoreEl.textContent = score;
            updateLeaderboard(score);

            const text = encodeURIComponent(`🐍 I scored ${score} in Snake Classic! Beat it: https://mini-game-arcade-three.vercel.app/games/snake.html`);
            whatsappBtn.href = `https://api.whatsapp.com/send?text=${text}`;
            gameoverScreen.classList.remove('hidden');
        }

        function gameStep() {
            dx = nextDx;
            dy = nextDy;
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                triggerGameOver();
                return;
            }

            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    triggerGameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                playSound(580, 0.08);
                placeFood();
            } else {
                snake.pop();
            }

            ctx.fillStyle = '#050811';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ef4444';
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

            ctx.shadowColor = '#22c55e';
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i === 0 ? '#4ade80' : '#16a34a';
                ctx.fillRect(snake[i].x * gridSize + 1, snake[i].y * gridSize + 1, gridSize - 2, gridSize - 2);
            }

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(`SCORE: ${score}`, 12, 24);
        }

        startBtn.addEventListener('click', resetGame);
        restartBtn.addEventListener('click', resetGame);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') setDir('UP');
            if (e.key === 'ArrowDown') setDir('DOWN');
            if (e.key === 'ArrowLeft') setDir('LEFT');
            if (e.key === 'ArrowRight') setDir('RIGHT');
            if (e.code === 'Space' && !isRunning) resetGame();
        });
    </script>
</body>
</html>
