<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Classic - Mini Arcade</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden;
        }
        header {
            width: 100%; max-width: 440px; display: flex; justify-content: space-between;
            align-items: center; padding: 12px 15px;
        }
        .back-btn { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .stats { display: flex; gap: 15px; font-weight: bold; }
        .game-container {
            position: relative; width: 100%; max-width: 420px;
            background: #1e293b; border-radius: 12px; overflow: hidden;
        }
        canvas { width: 100%; height: auto; display: block; aspect-ratio: 1; }
        .overlay {
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 15px; z-index: 10;
        }
        .btn {
            background: #0284c7; color: white; border: none; padding: 10px 24px;
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        .controls {
            display: grid; grid-template-columns: repeat(3, 60px); grid-gap: 8px;
            margin-top: 15px;
        }
        .ctrl-btn {
            background: #334155; color: white; border: none; border-radius: 8px;
            height: 50px; font-size: 20px; font-weight: bold; cursor: pointer;
        }
        .ctrl-btn:active { background: #0284c7; }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="back-btn">← Back</a>
        <div class="stats">
            <div>Score: <span id="scoreVal" style="color:#4ade80;">0</span></div>
            <div>Lvl: <span id="lvlVal" style="color:#38bdf8;">1</span></div>
        </div>
    </header>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="startScreen" class="overlay">
            <h2>Snake Classic</h2>
            <p>Use keyboard arrows or screen pads</p>
            <button class="btn" onclick="startGame()">Start</button>
        </div>
        <div id="overScreen" class="overlay" style="display:none;">
            <h2 style="color:#f43f5e;">Game Over</h2>
            <p id="finalScore">Score: 0</p>
            <button class="btn" onclick="startGame()">Play Again</button>
        </div>
    </div>

    <!-- On-screen controls for mobile -->
    <div class="controls">
        <div></div>
        <button class="ctrl-btn" onclick="setDir('UP')">▲</button>
        <div></div>
        <button class="ctrl-btn" onclick="setDir('LEFT')">◀</button>
        <button class="ctrl-btn" onclick="setDir('DOWN')">▼</button>
        <button class="ctrl-btn" onclick="setDir('RIGHT')">▶</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('scoreVal');
        const lvlVal = document.getElementById('lvlVal');
        const startScreen = document.getElementById('startScreen');
        const overScreen = document.getElementById('overScreen');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(freq, dur, type='sine') {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            } catch(e) {}
        }

        const grid = 20;
        let snake = [{x: 160, y: 160}], dir = {x: grid, y: 0}, nextDir = {x: grid, y: 0};
        let food = {x: 80, y: 80}, score = 0, level = 1, isRunning = false;
        let gameSpeed = 150, timer;

        function setDir(d) {
            if (d === 'UP' && dir.y === 0) nextDir = {x: 0, y: -grid};
            if (d === 'DOWN' && dir.y === 0) nextDir = {x: 0, y: grid};
            if (d === 'LEFT' && dir.x === 0) nextDir = {x: -grid, y: 0};
            if (d === 'RIGHT' && dir.x === 0) nextDir = {x: grid, y: 0};
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp') setDir('UP');
            if (e.key === 'ArrowDown') setDir('DOWN');
            if (e.key === 'ArrowLeft') setDir('LEFT');
            if (e.key === 'ArrowRight') setDir('RIGHT');
        });

        function spawnFood() {
            food.x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
            food.y = Math.floor(Math.random() * (canvas.height / grid)) * grid;
        }

        function startGame() {
            snake = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
            dir = {x: grid, y: 0}; nextDir = {x: grid, y: 0};
            score = 0; level = 1; gameSpeed = 140;
            scoreVal.innerText = score;
            lvlVal.innerText = level;
            spawnFood();
            startScreen.style.display = 'none';
            overScreen.style.display = 'none';
            isRunning = true;
            scheduleTick();
        }

        function scheduleTick() {
            if (!isRunning) return;
            clearTimeout(timer);
            timer = setTimeout(() => {
                step();
                scheduleTick();
            }, gameSpeed);
        }

        function step() {
            dir = nextDir;
            const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            // Wall Collisions
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                gameOver();
                return;
            }

            // Self Collision
            for (let part of snake) {
                if (part.x === head.x && part.y === head.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Food Eat
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreVal.innerText = score;
                playSfx(550, 0.08, 'square');
                spawnFood();
                // Difficulty Progression: Speed accelerates every 30 points
                level = Math.floor(score / 30) + 1;
                lvlVal.innerText = level;
                gameSpeed = Math.max(65, 140 - (level * 8));
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Food
            ctx.font = '18px sans-serif';
            ctx.fillText('🍎', food.x, food.y + 16);

            // Draw Snake
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#38bdf8' : '#0284c7';
                ctx.fillRect(part.x, part.y, grid - 2, grid - 2);
            });
        }

        function gameOver() {
            isRunning = false;
            playSfx(140, 0.3, 'sawtooth');
            document.getElementById('finalScore').innerText = `Score: ${score}`;
            overScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
